services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: edu-api
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/exam.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://43.128.141.25}
    volumes:
      - ./uploads:/uploads
      - ./data:/data
    restart: unless-stopped
    networks:
      - edu-network

  nginx:
    image: nginx:alpine
    container_name: edu-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - edu-network

networks:
  edu-network:
    driver: bridge
