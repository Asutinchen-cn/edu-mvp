server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(), geolocation=(), payment=()" always;

    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":"文件大小不能超过10MB"}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(upload|analyze|exams|wrong-questions|generate-practice|generate-knowledge-practice|export-practice-pdf|curriculum-units|generate-unit-worksheet|family-review-report|api-info)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
