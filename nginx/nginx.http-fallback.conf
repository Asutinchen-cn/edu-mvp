limit_req_zone $binary_remote_addr zone=edu_ai:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=edu_private:10m rate=60r/m;

server {
    listen 80;
    server_name 43.128.141.25;

    server_tokens off;
    client_max_body_size 52m;
    client_body_timeout 120s;
    limit_req_status 429;
    limit_req_log_level warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;

    error_page 413 = @payload_too_large;
    error_page 429 = @too_many_requests;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"success":false,"error":"多页试卷总大小不能超过50MB"}';
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"success":false,"error":"请求过于频繁，请稍后再试"}';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(upload|upload-batch|analyze|generate-practice|generate-knowledge-practice|generate-unit-worksheet)(/|$) {
        limit_req zone=edu_ai burst=6 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location ~ ^/(exams|wrong-questions|export-practice-pdf|family-review-report)(/|$) {
        limit_req zone=edu_private burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location ~ ^/(curriculum-units|api-info)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
